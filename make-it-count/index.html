<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Make it Count</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;background:#0c0c0a;color:#f7f2e8}body{display:grid;place-items:center}.app{width:min(430px,100vw);height:min(900px,100vh);position:relative;overflow:hidden;background:radial-gradient(circle at 75% 0,rgba(232,197,120,.09),transparent 30%),#171713;box-shadow:0 30px 100px #0008}.page{position:absolute;inset:0;padding:54px 22px 24px;display:none;flex-direction:column;overflow:auto}.page.on{display:flex}.top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#aaa394}.brand{font-weight:800;color:#f7f2e8}.hero{font-size:40px;line-height:1.03;letter-spacing:-.055em;font-weight:800;margin:25px 0 10px}.sub{font-size:14px;color:#aaa394;line-height:1.55}.field{margin-top:26px}.label{font-size:12px;color:#aaa394;margin-bottom:7px}input,textarea{width:100%;border:0;border-bottom:1px solid #ffffff18;background:transparent;color:#fff;padding:9px 0 13px;outline:0;font:inherit}input{font-size:22px}textarea{resize:none;min-height:70px;font-size:16px}.chips{display:flex;gap:7px}.chip{flex:1;border:1px solid #ffffff16;border-radius:15px;background:#ffffff05;color:#aaa394;padding:12px 6px}.chip.on{background:#f7f2e8;color:#191711;font-weight:800}.grow{flex:1}.primary,.secondary{width:100%;min-height:54px;border-radius:18px;font:inherit;font-weight:800}.primary{border:0;background:linear-gradient(#f7e3ae,#e6c477);color:#1e1911}.secondary{border:1px solid #ffffff18;background:#ffffff06;color:#fff}.note{text-align:center;font-size:10px;color:#777064;letter-spacing:.13em;margin-top:12px}.scene{height:410px;margin-top:22px;border-radius:30px;overflow:hidden;position:relative;border:1px solid #ffffff16;background:linear-gradient(#364037 0 66%,#795a42 66%);box-shadow:inset 0 0 80px #0005}.window{position:absolute;left:24px;top:28px;width:108px;height:115px;border:8px solid #947d5e;border-radius:12px;background:linear-gradient(#23383f,#2d464b)}.window:before,.window:after{content:"";position:absolute;background:#806d57}.window:before{width:4px;height:100%;left:44px}.window:after{height:4px;width:100%;top:47px}.moon{position:absolute;width:25px;height:25px;border-radius:50%;background:#f0ddb0;left:91px;top:48px}.shelf{position:absolute;right:25px;top:62px;width:112px;height:8px;background:#9b7556;border-radius:5px}.books{position:absolute;right:80px;top:34px;font-size:25px}.desk{position:absolute;left:39px;right:39px;bottom:100px;height:23px;background:#8f684a;border-radius:7px}.desk:before,.desk:after{content:"";position:absolute;width:14px;height:96px;background:#674933;top:18px}.desk:before{left:22px}.desk:after{right:22px}.person{position:absolute;width:215px;height:205px;object-fit:contain;left:8px;bottom:43px;animation:bob 1.8s ease-in-out infinite alternate}.lampglow{position:absolute;width:150px;height:150px;border-radius:50%;right:12px;bottom:87px;background:radial-gradient(circle,#ffd98766,transparent 67%);filter:blur(7px);opacity:.12;transition:.5s}.lantern{position:absolute;right:58px;bottom:124px;width:50px;height:74px;border:7px solid #b87448;border-radius:13px;background:#ffe1a0;box-shadow:0 0 0 5px #e9bc69 inset;filter:saturate(.5) brightness(.7);opacity:.56;transition:.5s}.lantern:before{content:"";position:absolute;left:14px;top:-26px;width:8px;height:24px;background:#725238;border-radius:4px}.lantern:after{content:"";position:absolute;left:5px;top:-18px;width:27px;height:7px;background:#725238;border-radius:4px}.scene.s2 .lantern{filter:saturate(.75) brightness(.85);opacity:.75}.scene.s3 .lantern{filter:none;opacity:.9}.scene.s4 .lantern{filter:none;opacity:1;box-shadow:0 0 0 5px #e9bc69 inset,0 0 35px #f2c96e88}.scene.s4 .lampglow{opacity:.85}.spark{position:absolute;right:77px;bottom:213px;color:#ffe4a0;animation:spark 1.1s ease-in-out infinite}.spark.b{right:53px;bottom:194px;animation-delay:.45s}.taskrow{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-top:18px}.task{font-size:21px;font-weight:800}.goal{font-size:12px;color:#aaa394;margin-top:5px}.timer{font-size:37px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.track{height:4px;background:#ffffff12;border-radius:9px;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:#e8c578;transition:.4s}.meta{display:flex;justify-content:space-between;color:#aaa394;font-size:10px;margin-top:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.reveal{align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 43%,#e8c57822,transparent 33%),#15140f}.gift{font-size:90px;color:#f6dda3;text-shadow:0 0 35px #e8c57866;animation:shake .28s ease-in-out 5}.reward{display:none;position:relative;width:210px;height:210px}.reward.show{display:block;animation:pop .7s cubic-bezier(.16,1,.25,1.18)}.reward .halo{position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle,#ffe2a055,transparent 68%)}.reward .lantern{right:74px;bottom:52px;transform:scale(1.55);opacity:1;filter:none;box-shadow:0 0 0 5px #e9bc69 inset,0 0 40px #f2c96e88}.kicker{font-size:10px;color:#c6b287;letter-spacing:.18em;text-transform:uppercase;margin-top:16px}.rewardname{font-size:34px;font-weight:850;letter-spacing:-.04em;margin-top:7px}.copy{font-size:13px;color:#aaa394;line-height:1.6;max-width:320px;margin-top:8px}.bottom{position:absolute;left:22px;right:22px;bottom:24px}.conf{position:absolute;width:7px;height:12px;border-radius:2px;z-index:10;animation:fall 1.7s linear forwards}.memory{margin-top:15px;border:1px solid #ffffff16;background:#ffffff08;border-radius:22px;padding:17px}.memory strong{font-size:17px}.memory p{font-size:13px;color:#aaa394;line-height:1.5;margin:7px 0}.roomtitle{font-size:38px;line-height:1.04;font-weight:800;letter-spacing:-.05em;margin:24px 0 8px}.celebrate{position:absolute;width:150px;height:135px;object-fit:contain;left:20px;bottom:105px;opacity:.8}@keyframes bob{to{transform:translateY(-5px) rotate(1deg)}}@keyframes spark{0%,100%{opacity:0;transform:translateY(5px) scale(.7)}50%{opacity:1;transform:translateY(-10px) scale(1.15)}}@keyframes shake{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}@keyframes pop{from{opacity:0;transform:scale(.3) translateY(20px)}to{opacity:1;transform:scale(1)}}@keyframes fall{from{opacity:1;transform:translateY(-80px) rotate(0)}to{opacity:0;transform:translateY(900px) rotate(540deg)}}@media(max-height:740px){.scene{height:330px}.hero,.roomtitle{font-size:34px}.page{padding-top:40px}}
</style>
</head>
<body><main class="app">
<section class="page on" id="setup"><div class="top"><span class="brand">MAKE IT COUNT</span><span>成果工坊</span></div><div class="hero">今天，<br>你想做成什么？</div><div class="sub">时间只是投入。结束时，带走一个真正属于你的成果。</div><div class="field"><div class="label">我要完成</div><input id="task" value="写完第 12 章"></div><div class="field"><div class="label">成果标准</div><textarea id="goal">完成至少 2000 字初稿</textarea></div><div class="field"><div class="label">给自己一点时间</div><div class="chips"><button class="chip" data-s="1500">25 分</button><button class="chip on" data-s="3000">50 分</button><button class="chip" data-s="5400">90 分</button><button class="chip" data-s="10">10 秒</button></div></div><div class="grow"></div><button class="primary" id="start">开始创造</button><div class="note">DON'T COUNT TIME. MAKE IT COUNT.</div></section>
<section class="page" id="focus"><div class="top"><span class="brand">FOCUS STUDIO</span><span id="pct">0%</span></div><div class="scene" id="scene"><div class="window"></div><div class="moon"></div><div class="shelf"></div><div class="books">▥ ▥ ❧</div><div class="desk"></div><img class="person" src="./assets/sitting-reading-small.webp"><div class="lampglow"></div><div class="lantern"></div><i class="spark">✦</i><i class="spark b">✧</i></div><div class="taskrow"><div><div class="task" id="ftask"></div><div class="goal" id="fgoal"></div></div><div class="timer" id="timer"></div></div><div class="track"><div class="bar" id="bar"></div></div><div class="meta"><span id="stagecopy">正在准备材料</span><span>不用管它，去做现实里的事。</span></div><div class="grow"></div><div class="actions"><button class="secondary" id="pause">暂停</button><button class="primary" id="done">提前完成</button></div></section>
<section class="page reveal" id="reveal"><div class="gift" id="gift">✦</div><div class="reward" id="reward"><div class="halo"></div><div class="lantern"></div></div><div class="kicker" id="rk">CREATION COMPLETE</div><div class="rewardname" id="rn">正在完成最后一道工序…</div><div class="copy" id="rc">你完成的事情，会变成一件真正留下来的东西。</div><div class="bottom"><button class="primary" id="place" style="display:none">放进我的房间</button></div></section>
<section class="page" id="room"><div class="top"><span class="brand">MY ROOM</span><span>1 件成果</span></div><div class="roomtitle">这是你<br>一件件做出来的。</div><div class="sub">不是累计时长。房间里的每样东西，背后都是一件真实完成的事。</div><div class="scene s4"><div class="window"></div><div class="moon"></div><div class="shelf"></div><div class="books">▥ ▥ ❧</div><div class="desk"></div><img class="celebrate" src="./assets/moshing-small.webp"><div class="lampglow"></div><div class="lantern"></div></div><div class="memory"><strong>雨夜书灯 · RARE</strong><p id="memory"></p><div class="label" id="mm"></div></div><div class="grow"></div><button class="primary" id="again">再做成一件事</button></section>
</main><script>
const $=q=>document.querySelector(q),pages=[...document.querySelectorAll('.page')];let total=3000,left=3000,tick=null,paused=false;const show=id=>pages.forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');total=+b.dataset.s});const fmt=s=>s<60?'00:'+String(s).padStart(2,'0'):String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');function render(){const p=Math.max(0,Math.min(1,1-left/total)),n=Math.round(p*100);$('#timer').textContent=fmt(left);$('#pct').textContent=n+'%';$('#bar').style.width=n+'%';const sc=$('#scene');sc.className='scene '+(p>.75?'s4':p>.5?'s3':p>.25?'s2':'');$('#stagecopy').textContent=p<.25?'正在准备材料':p<.5?'轮廓慢慢出现':p<.75?'它快要完成了':'最后一点点'}$('#start').onclick=()=>{$('#ftask').textContent=$('#task').value||'完成一件重要的事';$('#fgoal').textContent=$('#goal').value||'得到一个明确成果';left=total;paused=false;$('#pause').textContent='暂停';show('focus');render();clearInterval(tick);tick=setInterval(()=>{if(!paused){left--;render();if(left<=0)complete()}},1000)};$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'继续':'暂停'};$('#done').onclick=complete;function complete(){clearInterval(tick);show('reveal');$('#gift').style.display='block';$('#reward').classList.remove('show');$('#place').style.display='none';$('#rn').textContent='正在完成最后一道工序…';setTimeout(()=>{$('#gift').style.display='none';$('#reward').classList.add('show');$('#rk').textContent='RARE CREATION';$('#rn').textContent='雨夜书灯';$('#rc').textContent='它只属于这一次成果。以后看到它，你会记得自己真正完成过什么。';$('#place').style.display='block';confetti()},1100)}function confetti(){const c=['#f3d38b','#fff1bf','#91a083','#b98062','#d7c5a4'];for(let i=0;i<38;i++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'%';e.style.top=(-90-Math.random()*160)+'px';e.style.background=c[i%c.length];e.style.animationDelay=Math.random()*.4+'s';$('#reveal').appendChild(e);setTimeout(()=>e.remove(),2200)}}$('#place').onclick=()=>{$('#memory').textContent=($('#task').value||'完成一件重要的事')+' · '+($('#goal').value||'得到一个明确成果');$('#mm').textContent='刚刚 · '+(total===10?'10 秒演示':Math.round(total/60)+' 分钟');show('room')};$('#again').onclick=()=>show('setup');
</script></body></html>
